version: 2

# 8.4：Dependabot 管依赖升级与漏洞告警，并把告警当 issue 处理。

updates:
  - package-ecosystem: TODO   # npm / pip / cargo / github-actions
    directory: "/"
    schedule:
      interval: monthly        # 每月一次小版本升级；安全告警即时处理
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
